<!doctype html>
<html><head><style>
html,body{margin:0;padding:0;background:#111}
.wrap{display:flex;gap:16px;padding:16px;align-items:flex-end}
.box{display:flex;flex-direction:column;align-items:center;gap:4px;color:#aaa;font:12px sans-serif}
img{display:block;image-rendering:pixelated}
</style></head>
<body>
<div class="wrap">
  <div class="box"><img src="/favicon.svg" width="16" height="16" alt="16"><span>16</span></div>
  <div class="box"><img src="/favicon.svg" width="32" height="32" alt="32"><span>32</span></div>
  <div class="box"><img src="/favicon.svg" width="64" height="64" alt="64"><span>64</span></div>
</div>
</body></html>
